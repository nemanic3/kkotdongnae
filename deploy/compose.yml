name: kkotdongnae-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.private/production.env
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.private/production.env
    ports:
      - '127.0.0.1:18080:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/',headers={'X-Origin-Secret':os.environ['ORIGIN_PROXY_SECRET'],'X-Forwarded-Proto':'https','Host':'kkotdongnae.nemanic.dev'}); urllib.request.urlopen(r)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  database:
    name: kkotdongnae_production_database
    external: true
