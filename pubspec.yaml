name: kkotdongnae
description: "Location-based flower shop finder app - 꽃동네"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Supabase
  supabase_flutter: ^2.5.6

  # Location & Maps
  geolocator: ^12.0.0
  flutter_naver_map: ^1.2.3
  geocoding: ^3.0.0

  # Navigation
  go_router: ^14.2.0

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.2.6
  image_picker: ^1.1.0
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^5.0.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  http: ^1.6.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
