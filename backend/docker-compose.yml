version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kkotdongnae_db
      POSTGRES_USER: kkot_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private development password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set a private development signing key}
      - POSTGRES_DB=kkotdongnae_db
      - POSTGRES_USER=kkot_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a private development password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
